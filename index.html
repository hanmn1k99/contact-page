<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - Minh Hân</title>
    <meta name="description" content="Danh thiếp điện tử của Minh Hân - Tổng hợp các liên kết cá nhân.">
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animation Layer -->
    <div class="bg-animation"></div>

    <!-- Main Content Container -->
    <main id="app" class="glass-container">
        <!-- Content will be injected here by script.js -->
    </main>

    <!-- Ionicons (Thư viện Icon) -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- App Data & Logic -->
    <script src="config.js"></script>
    <script src="script.js"></script>

    <!-- Vanilla Tilt for 3D Glass Effect -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script>
        // Initialize 3D Tilt Effect
        VanillaTilt.init(document.querySelector(".glass-container"), {
            max: 5,
            speed: 400,
            glare: false,
            gyroscope: true
        });
    </script>
</body>
</html>
